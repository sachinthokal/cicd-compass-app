name: CICD Compass

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # -------------------------------------------------------------
  # Job 1: Quality, Secret & Dependency Security Gates
  # -------------------------------------------------------------
  code-quality:
    name: Code Quality & Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify Java and Maven
        run: |
          java -version
          mvn -version

      - name: Build, Lint and Test
        run: mvn clean verify

  # -------------------------------------------------------------
  # Job 2: Build, Security Scan, Push & Sign
  # -------------------------------------------------------------
  code-build:
    name: Build, Scan, Push & Cosign Image
    needs: code-quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Verify Java, Maven and Docker
        run: |
          java -version
          mvn -version
          docker version

      - name: Build App Image
        run: docker build -t cicd-compass-app:local-test .

      - name: Scan App Image with Trivy
        uses: aquasecurity/trivy-action@v1
        with:
          image-ref: cicd-compass-app:local-test

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push App Image to Docker Hub
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          docker tag cicd-compass-app:local-test \
          ${{ vars.DOCKERHUB_USERNAME }}/cicd-compass-app:latest \
          && docker push ${{ vars.DOCKERHUB_USERNAME }}/cicd-compass-app:latest