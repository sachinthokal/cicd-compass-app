name: CICD Compass

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:

  # -------------------------------------------------------------
  # Job 1: Code Quality, Gitleaks Scan & Automated Test Case Execution
  # -------------------------------------------------------------
  quality-scan:
    name: Code Quality & Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Lint Code with Checkstyle
        run: mvn checkstyle:check

      - name: Automated Test Case Execution
        run: mvn test

  # -------------------------------------------------------------
  # Job 2: Build, Image Scan, SBOM Generation & Push to Docker Hub
  # -------------------------------------------------------------
  build-push:
    name: Build, Scan & Report, Push
    needs: [quality-scan]
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push-image.outputs.DIGEST }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Verify Java, Maven and Docker
        run: |
          echo "::group::Java, Maven and Docker Version Information"
          java -version
          mvn -version
          docker version
          echo "::endgroup::"

      - name: Get Application Version
        id: version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build App Image for Local Testing
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: cicd-compass-app:local-test
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: cicd-compass-app:local-test
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Generate SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: cicd-compass-app:local-test
          format: 'spdx-json'
          output: 'cicd-compass-sbom.spdx.json'

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-report
          path: cicd-compass-sbom.spdx.json
          retention-days: 7

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and Push Docker Image
        id: push-image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          echo "::group::Docker Image & Version Information"
          IMAGE=${{ vars.DOCKERHUB_USERNAME }}/cicd-compass-app
          VERSION="v${{ steps.version.outputs.VERSION }}"
          GIT_SHA="sha-${GITHUB_SHA:0:7}"
          echo "::endgroup::"

          echo "::group::Docker Image Tagging"
          docker tag cicd-compass-app:local-test $IMAGE:latest
          docker tag cicd-compass-app:local-test $IMAGE:${GIT_SHA}
          docker tag cicd-compass-app:local-test $IMAGE:${VERSION}
          echo "::endgroup::"
          
          echo "::group::Docker Image Pushing"
          docker push $IMAGE:latest
          docker push $IMAGE:${GIT_SHA}
          docker push $IMAGE:${VERSION}
          echo "::endgroup::"

          echo "::group::Docker Image Digest Retrieval"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' $IMAGE:$GIT_SHA)
          echo "Image digest: $DIGEST"
          echo "::endgroup::"

          echo "IMAGE=$IMAGE" >> "$GITHUB_OUTPUT"       # sachinthokal/cicd-compass-app
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"   # v1.0.0
          echo "GIT_SHA=$GIT_SHA" >> "$GITHUB_OUTPUT"   # sha-<first 7 characters of the commit SHA>
          echo "DIGEST=$DIGEST" >> "$GITHUB_OUTPUT"     # Digest of the pushed image

  # -------------------------------------------------------------
  # Job 3: Sign and Verify Docker Image with Cosign
  # -------------------------------------------------------------
  image-cosign:
    name: Cosign Docker Image
    needs: [build-push]
    runs-on: ubuntu-latest

    steps:
      - name: Install Cosign
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: sigstore/cosign-installer@v3
        
      - name: Sign the Published Docker Image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          COSIGN_YES: "true"
        run: cosign sign "${{ needs.build-push.outputs.digest }}"

      - name: Verify the Signed Docker Image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          cosign verify \
            "${{ needs.build-push.outputs.digest }}" \
            --certificate-identity-regexp='https://github.com/sachinthokal/cicd-compass-app/.github/workflows/cicd-compass-deployment.yaml@refs/heads/main' \
            --certificate-oidc-issuer='https://token.actions.githubusercontent.com'