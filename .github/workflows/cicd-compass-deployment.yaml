name: CICD Compass

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:

  # -------------------------------------------------------------
  # Job 1: Code Quality, Gitleaks Scan & Automated Test Case Execution
  # -------------------------------------------------------------
  quality-scan:
    name: Code Quality & Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Lint Code with Checkstyle
        run: mvn checkstyle:check

      - name: Automated Test Case Execution
        run: mvn test

  # -------------------------------------------------------------
  # Job 2: Build, Image Scan, SBOM Generation & Push to Docker Hub
  # -------------------------------------------------------------
  build-push:
    name: Build, Scan & Push
    needs: [quality-scan]
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push-image.outputs.DIGEST }}
      image: ${{ steps.push-image.outputs.IMAGE }}
      version: ${{ steps.push-image.outputs.VERSION }}
      git_sha: ${{ steps.push-image.outputs.GIT_SHA }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Verify Java, Maven and Docker
        run: |
          echo "::group::Java, Maven and Docker Version Information"
          java -version
          mvn -version
          docker version
          echo "::endgroup::"

      - name: Get Application Version
        id: version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "Application Version: $VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build App Image for Local Testing
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_SUMMARY: false
        with:
          context: .
          push: false
          load: true
          tags: cicd-compass-app:local-test
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}
          no-cache: true

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: cicd-compass-app:local-test
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Generate SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: cicd-compass-app:local-test
          format: 'spdx-json'
          output: 'cicd-compass-sbom.spdx.json'

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-report
          path: cicd-compass-sbom.spdx.json
          retention-days: 7

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and Push Docker Image
        id: push-image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          echo "::group::Docker Image & Version Information"
          IMAGE=${{ vars.DOCKERHUB_USERNAME }}/cicd-compass-app
          VERSION="v${{ steps.version.outputs.VERSION }}"
          GIT_SHA="sha-${GITHUB_SHA:0:7}"
          echo "::endgroup::"

          echo "::group::Docker Image Tagging"
          docker tag cicd-compass-app:local-test $IMAGE:latest
          docker tag cicd-compass-app:local-test $IMAGE:${GIT_SHA}
          docker tag cicd-compass-app:local-test $IMAGE:${VERSION}
          echo "::endgroup::"
          
          echo "::group::Docker Image Pushing"
          docker push $IMAGE:latest
          docker push $IMAGE:${GIT_SHA}
          docker push $IMAGE:${VERSION}
          echo "::endgroup::"

          echo "::group::Docker Image Digest Retrieval"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' $IMAGE:$GIT_SHA)
          echo "Image digest: $DIGEST"
          echo "::endgroup::"

          echo "IMAGE=$IMAGE" >> "$GITHUB_OUTPUT"       # sachinthokal/cicd-compass-app
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"   # v1.0.0
          echo "GIT_SHA=$GIT_SHA" >> "$GITHUB_OUTPUT"   # sha-<first 7 characters of the commit SHA>
          echo "DIGEST=$DIGEST" >> "$GITHUB_OUTPUT"     # Digest of the pushed image

  # -------------------------------------------------------------
  # Job 3: Sign and Verify Docker Image with Cosign
  # -------------------------------------------------------------
  image-cosign:
    name: Image Sign & Verify
    needs: [build-push]
    runs-on: ubuntu-latest

    steps:
      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - name: Install Cosign
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: sigstore/cosign-installer@v3
        
      - name: Sign the Published Docker Image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          COSIGN_YES: "true"
        run: cosign sign "${{ needs.build-push.outputs.digest }}"

      - name: Verify the Signed Docker Image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          cosign verify \
            "${{ needs.build-push.outputs.digest }}" \
            --certificate-identity-regexp='https://github.com/sachinthokal/cicd-compass-app/.github/workflows/cicd-compass-deployment.yaml@refs/heads/main' \
            --certificate-oidc-issuer='https://token.actions.githubusercontent.com'

  # -------------------------------------------------------------
  # Job 4: Tag Deployment
  # -------------------------------------------------------------
  tag-deploy:
    name: Set Tag in ArgoCD Repository
    needs: [build-push, image-cosign]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ArgoCD Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/argocd-for-devops
          token: ${{ secrets.ARGOCD_REPO_PAT }}
          path: cicd-compass-app

      - name: Debug ArgoCD Repository Structure
        run: |
          pwd
          echo "===================="
          ls -la
          echo "===================="
          find cicd-compass-app -maxdepth 5 -type f | sort

      - name: Configure Git User
        run: |
          cd cicd-compass-app
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

      - name: Update Image Digest in Kubernetes Manifest
        working-directory: cicd-compass-app/cicd-compass-app
        run: |
          yq -i '.spec.template.spec.containers[0].image = "${{ needs.build-push.outputs.digest }}"' \
            02-cicd-compass-deployment.yaml
        

        
      - name: Commit and Push Changes
        run: |
          cd cicd-compass-app
          git status
          git add cicd-compass-app/02-cicd-compass-deployment.yaml
          git commit -m "chore(argocd): update image tag to ${{ needs.build-push.outputs.version }}"
          git push origin main
  
  
  # -------------------------------------------------------------
  # Job 5: Stage Deployment
  # -------------------------------------------------------------
  stage-deploy:
    name: Stage Deployment
    needs: [tag-deploy]
    runs-on: ubuntu-latest

    steps:
      - name: Stage Deployment Placeholder
        run: echo "Stage deployment steps would go here."


  # -------------------------------------------------------------
  # Job 6: Production Deployment
  # -------------------------------------------------------------
  prod-deploy:
    name: Production Deployment
    needs: [stage-deploy]
    environment: production
    runs-on: ubuntu-latest

    steps:
      - name: Production Deployment Placeholder
        run: echo "Production deployment steps would go here."

  
  #-------------------------------------------------------------
  # Job 7: CICD Pipeline Summary Report
  # -------------------------------------------------------------
  pipeline-summary:
    name: CICD Pipeline Summary
    if: always()
    needs:
      - quality-scan
      - build-push
      - image-cosign
      - tag-deploy
      - stage-deploy
      - prod-deploy
    runs-on: ubuntu-latest

    steps:
      - name: Generate Pipeline Summary
        env:
          QUALITY_STATUS: ${{ needs.quality-scan.result }}
          BUILD_STATUS: ${{ needs.build-push.result }}
          COSIGN_STATUS: ${{ needs.image-cosign.result }}
          TAG_STATUS: ${{ needs.tag-deploy.result }}
          STAGE_STATUS: ${{ needs.stage-deploy.result }}
          PROD_STATUS: ${{ needs.prod-deploy.result }}

          IMAGE: ${{ needs.build-push.outputs.image }}
          VERSION: ${{ needs.build-push.outputs.version }}
          GIT_SHA: ${{ needs.build-push.outputs.git_sha }}
          DIGEST: ${{ needs.build-push.outputs.digest }}
        run: |
          if [[ "$QUALITY_STATUS" == "success" &&
                "$BUILD_STATUS" == "success" &&
                "$COSIGN_STATUS" == "success" &&
                "$TAG_STATUS" == "success" &&
                "$STAGE_STATUS" == "success" &&
                "$PROD_STATUS" == "success" ]]; then
            OVERALL_STATUS="🟢 SUCCESS"
          else
            OVERALL_STATUS="🔴 FAILED"
          fi

          echo "# 🚀 CICD Compass - Pipeline Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "## Overall Pipeline Status" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### $OVERALL_STATUS" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "## Pipeline Information" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Property | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Repository | \`${{ github.repository }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Branch | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${GITHUB_SHA:0:7}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Trigger | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "## Docker Image Information" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Property | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image | \`$IMAGE\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version | \`$VERSION\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Git SHA | \`$GIT_SHA\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Digest | \`$DIGEST\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "## Stage Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Stage | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Code Quality & Security | $QUALITY_STATUS |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build, Scan & Push | $BUILD_STATUS |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image Sign & Verify | $COSIGN_STATUS |" >> "$GITHUB_STEP_SUMMARY"
          echo "| GitOps Tag Deployment | $TAG_STATUS |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Stage Deployment | $STAGE_STATUS |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Production Deployment | $PROD_STATUS |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "## Deployment Pipeline" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          echo "Code" >> "$GITHUB_STEP_SUMMARY"
          echo "  ↓" >> "$GITHUB_STEP_SUMMARY"
          echo "Quality & Security" >> "$GITHUB_STEP_SUMMARY"
          echo "  ↓" >> "$GITHUB_STEP_SUMMARY"
          echo "Docker Build" >> "$GITHUB_STEP_SUMMARY"
          echo "  ↓" >> "$GITHUB_STEP_SUMMARY"
          echo "Trivy Scan" >> "$GITHUB_STEP_SUMMARY"
          echo "  ↓" >> "$GITHUB_STEP_SUMMARY"
          echo "SBOM Generation" >> "$GITHUB_STEP_SUMMARY"
          echo "  ↓" >> "$GITHUB_STEP_SUMMARY"
          echo "Docker Hub Push" >> "$GITHUB_STEP_SUMMARY"
          echo "  ↓" >> "$GITHUB_STEP_SUMMARY"
          echo "Cosign Sign & Verify" >> "$GITHUB_STEP_SUMMARY"
          echo "  ↓" >> "$GITHUB_STEP_SUMMARY"
          echo "Stage Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "  ↓" >> "$GITHUB_STEP_SUMMARY"
          echo "Production Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "---" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "_Generated automatically by CICD Compass._" >> "$GITHUB_STEP_SUMMARY"